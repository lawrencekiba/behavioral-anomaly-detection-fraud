[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "behavioral-anomaly-detection-fraud"
version = "0.1.0"
description = "Benchmarking unsupervised anomaly detection algorithms (Isolation Forest, LOF, One-Class SVM, Deep Autoencoder) on behavioral deviation patterns in fraud detection."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Afiq CM", email = "mafqcm@gmail.com" }
]
dependencies = [
    "numpy>=1.26.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.4.0",
    "torch>=2.0.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "pyarrow>=15.0.0",
]

[project.urls]
Homepage = "https://github.com/lawrencekiba/behavioral-anomaly-detection-fraud"
Repository = "https://github.com/lawrencekiba/behavioral-anomaly-detection-fraud.git"
